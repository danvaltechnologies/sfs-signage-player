org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Default console the player talks to. Overridable on the device setup screen
# and at build time: ./gradlew assembleRelease -PapiBaseUrl=https://...
#
# This is the actual authoritative source for the default — it's a project
# property, so build.gradle.kts's project.findProperty("apiBaseUrl") always
# finds THIS value first. Its own "?: https://api.areafiftysix.com" fallback
# only ever applies if this line were removed entirely, which is exactly
# why changing that fallback alone (2026-09-19) silently did nothing: a
# build still came out with the old console.sundryfoods.com placeholder
# baked in, from here, not from the code.
apiBaseUrl=https://api.areafiftysix.com
