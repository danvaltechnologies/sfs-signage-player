name: Build player APK

# Manual "Run workflow" button, plus automatic builds on every push. No
# Gradle wrapper is checked in, so this provisions Gradle itself rather
# than relying on ./gradlew.
on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

permissions:
  # Needed so this workflow can commit the debug keystore back to the repo
  # the one time it has to generate it.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A fresh SDK root rather than relying on whatever happens to be
      # preinstalled on the runner image — deterministic across runs.
      # Both vars point here: the runner image bakes in its own
      # ANDROID_SDK_ROOT regardless of what a job sets for ANDROID_HOME,
      # and Gradle refuses to guess between two different paths — setting
      # both to the same one removes the disagreement instead of the var.
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      # sdkmanager --licenses is interactive by default — it prints each
      # license and waits on stdin. In a non-interactive shell that reads
      # straight to EOF and every license comes back rejected. Piping an
      # endless "y" answers every prompt instead.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install the SDK platform and build-tools this project targets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Every debug build needs the SAME signature, or Android refuses to
      # install a newer one over an older one (and self-update, which relies
      # on exactly that, silently fails). Generate the keystore once and
      # commit it back to the repo; every run after this one finds it
      # already checked in and reuses it instead of making a new one.
      - name: Ensure a stable debug keystore exists
        run: |
          if [ -f app/debug.keystore ]; then
            echo "debug.keystore already checked in — reusing it"
          else
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "Add stable debug keystore for CI builds [skip ci]"
            git push
          fi

      # No apiBaseUrl override needed anymore — build.gradle.kts now defaults
      # DEFAULT_API_BASE_URL to the real, permanent backend directly, so a
      # technician pairing a box only ever has to type the 6-digit PIN.
      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sundry-player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A build artifact's download link requires a signed-in, authorized
      # GitHub session — no good for a device's self-update check, which is
      # just a plain unauthenticated HTTP GET. Publishing to this one fixed
      # release tag instead gives a permanent, stable, publicly-downloadable
      # URL that always points at the latest build (the action replaces the
      # existing release's asset rather than creating a new release each
      # time), as long as the repo itself is public.
      - name: Publish to the "latest-debug" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          body: Auto-published by CI from ${{ github.sha }}. Always the most recent successful build on main.
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk

      # ---- Tell paired boxes this build exists ------------------------------
      #
      # The step above gives a permanent, public, unauthenticated download
      # URL (this repo is public) — but nothing yet tells the backend a new
      # build is there. Boxes self-update off GET /public/player/update,
      # which only ever returns whatever was last registered with
      # POST /player/releases (see server/src/modules/releases/releases.controller.ts) —
      # so without this step, publishing a release here has zero effect on
      # any box until someone calls that endpoint by hand.
      #
      # Needs a signed-in console session, so this logs in as a dedicated,
      # least-privilege service account (only the "screens" module — see the
      # player repo README for how to set one up) using two secrets:
      # PLAYER_RELEASE_API_EMAIL and PLAYER_RELEASE_API_PASSWORD. Both are
      # optional so the build itself never fails while they're not set up
      # yet — this step just quietly skips until they are. Gated to main so
      # a manual run on some other branch can never push itself to the fleet.
      - name: Read the version this build is
        id: version
        if: github.ref == 'refs/heads/main'
        run: |
          echo "code=$(grep -oP 'playerVersionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP 'playerVersionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Compute the APK's checksum
        id: checksum
        if: github.ref == 'refs/heads/main'
        run: echo "sha256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Register this build with the console, so paired boxes self-update to it
        if: github.ref == 'refs/heads/main' && secrets.PLAYER_RELEASE_API_EMAIL != ''
        env:
          RELEASE_API_EMAIL: ${{ secrets.PLAYER_RELEASE_API_EMAIL }}
          RELEASE_API_PASSWORD: ${{ secrets.PLAYER_RELEASE_API_PASSWORD }}
          API_BASE: https://api.areafiftysix.com
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          APK_URL: https://github.com/danvaltechnologies/sfs-signage-player/releases/download/latest-debug/app-debug.apk
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -X POST "$API_BASE/auth/login" \
            -H "content-type: application/json" \
            -d "$(python3 -c 'import json,os;print(json.dumps({"email":os.environ["RELEASE_API_EMAIL"],"password":os.environ["RELEASE_API_PASSWORD"]}))')" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['accessToken'])")
          curl -sf -X POST "$API_BASE/player/releases" \
            -H "authorization: Bearer $TOKEN" \
            -H "content-type: application/json" \
            -d "$(python3 -c 'import json,os;print(json.dumps({"versionCode":int(os.environ["VERSION_CODE"]),"versionName":os.environ["VERSION_NAME"],"apkUrl":os.environ["APK_URL"],"sha256":os.environ["SHA256"],"notes":"Auto-published from "+os.environ["COMMIT_SHA"]}))')"
