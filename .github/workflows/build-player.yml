name: Build player APK

# Manual "Run workflow" button, plus automatic builds on every push. No
# Gradle wrapper is checked in, so this provisions Gradle itself rather
# than relying on ./gradlew.
on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A fresh SDK root rather than relying on whatever happens to be
      # preinstalled on the runner image — deterministic across runs.
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

      # sdkmanager --licenses is interactive by default — it prints each
      # license and waits on stdin. In a non-interactive shell that reads
      # straight to EOF and every license comes back rejected. Piping an
      # endless "y" answers every prompt instead.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install the SDK platform and build-tools this project targets
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Debug builds are auto-signed with a throw-away debug key by the
      # Android Gradle Plugin itself — no keystore secrets needed just to
      # produce something installable for testing.
      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sundry-player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
