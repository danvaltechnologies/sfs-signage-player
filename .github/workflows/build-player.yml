name: Build player APK

# Manual "Run workflow" button, plus automatic builds on every push. No
# Gradle wrapper is checked in, so this provisions Gradle itself rather
# than relying on ./gradlew.
on:
  workflow_dispatch: {}
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Debug builds are auto-signed with a throw-away debug key by the
      # Android Gradle Plugin itself — no keystore secrets needed just to
      # produce something installable for testing.
      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sundry-player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
